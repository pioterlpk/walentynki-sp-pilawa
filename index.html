<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dyskoteka Walentynkowa</title>

<style>
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#ff6a88;color:white;overflow-x:hidden}
#introScreen{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column}
#startBtn{padding:25px 50px;font-size:2rem;font-weight:bold;background:#ff0a5c;border:none;border-radius:50px;color:white;cursor:pointer;box-shadow:0 0 25px #ff0a5c;display:flex;gap:10px}
.heart-start{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}

#content{display:none;max-width:1000px;margin:80px auto;padding:0 20px;text-align:center}
section{background:rgba(255,255,255,.12);padding:40px 30px;border-radius:25px;margin-bottom:40px;text-align:left}

#countdown{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.time-box{background:rgba(0,0,0,.35);padding:15px 22px;border-radius:20px;min-width:90px;text-align:center;box-shadow:0 0 25px #ff0a5c;animation:glow 2s infinite}
.time-box span{font-size:2rem;font-weight:bold;text-shadow:0 0 15px #ff0a5c}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.gallery img,.gallery video{width:100%;height:220px;object-fit:cover;border-radius:20px}

#showIntroBtn{padding:16px 30px;font-size:1.3rem;font-weight:bold;background:#ff0a5c;border:none;border-radius:40px;color:white;cursor:pointer;box-shadow:0 0 15px #ff0a5c;margin-bottom:50px}

/* MODAL ZAPOWIEDZI */
#introModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:9999}
#introModal.show{display:flex}
#introModal video{max-width:95vw;max-height:85vh;border-radius:15px}
#closeIntroBtn{position:absolute;top:20px;right:20px;font-size:2rem;background:none;border:none;color:white;cursor:pointer}
</style>
</head>

<body>

<div id="introScreen">
  <button id="startBtn">
    <span class="heart-start">❤️</span>
    WIĘCEJ INFORMACJI O DYSKOTECE
    <span class="heart-start">❤️</span>
  </button>
</div>

<div id="content">

<h1>DYSKOTEKA WALENTYNKOWA</h1>

<button id="showIntroBtn">❤️ OBEJRZYJ ZAPOWIEDŹ ❤️</button>

<section>
<h2>Odliczanie</h2>
<div id="countdown">
  <div class="time-box"><span id="days">0</span>dni</div>
  <div class="time-box"><span id="hours">0</span>godz</div>
  <div class="time-box"><span id="minutes">0</span>min</div>
  <div class="time-box"><span id="seconds">0</span>sek</div>
</div>
</section>

<section>
<h2>Jak wyglądały poprzednie imprezy?</h2>
<div class="gallery">
  <img src="https://res.cloudinary.com/dqloszyfj/image/upload/v1768865895/1000002621_murjtx.jpg">
  <img src="https://res.cloudinary.com/dqloszyfj/image/upload/v1768865983/1000002609_zsyqm6.jpg">
  <video controls>
    <source src="https://res.cloudinary.com/dqloszyfj/video/upload/v1768857800/1000002708_h7much.mp4">
  </video>
</div>
</section>

</div>

<!-- MODAL ZAPOWIEDZI -->
<div id="introModal">
  <button id="closeIntroBtn">✕</button>
  <video id="introVideo" controls playsinline>
    <source src="https://res.cloudinary.com/dqloszyfj/video/upload/v1768857800/1000002708_h7much.mp4">
  </video>
</div>

<!-- AUDIO TŁO -->
<audio id="bgAudio" loop>
  <source src="https://res.cloudinary.com/dqloszyfj/video/upload/v1768840494/Mig_-_Ta_Malutka_Blondynka_Official_Video_osiidd.mp3">
</audio>

<script>
const startBtn=document.getElementById("startBtn");
const introScreen=document.getElementById("introScreen");
const content=document.getElementById("content");
const bgAudio=document.getElementById("bgAudio");

const showIntroBtn=document.getElementById("showIntroBtn");
const introModal=document.getElementById("introModal");
const closeIntroBtn=document.getElementById("closeIntroBtn");
const introVideo=document.getElementById("introVideo");

startBtn.onclick=()=>{
  introScreen.style.display="none";
  content.style.display="block";
  bgAudio.volume=1;
  bgAudio.play().catch(()=>{});
};

/* ZAPOWIEDŹ */
showIntroBtn.onclick=()=>{
  introModal.classList.add("show");
  introVideo.currentTime=0;
  introVideo.play();
  bgAudio.volume=0;
};
closeIntroBtn.onclick=()=>{
  introVideo.pause();
  introModal.classList.remove("show");
  bgAudio.volume=1;
};
introVideo.onended=()=>{
  introModal.classList.remove("show");
  bgAudio.volume=1;
};

/* COUNTDOWN */
const target=new Date("2026-02-12T15:00:00").getTime();
setInterval(()=>{
  const d=target-Date.now();
  if(d<0)return;
  days.textContent=Math.floor(d/86400000);
  hours.textContent=Math.floor(d/3600000)%24;
  minutes.textContent=Math.floor(d/60000)%60;
  seconds.textContent=Math.floor(d/1000)%60;
},1000);

/* GALERIA WIDEO = WYCISZENIE */
document.querySelectorAll(".gallery video").forEach(v=>{
  v.addEventListener("play",()=>bgAudio.volume=0);
  v.addEventListener("pause",()=>bgAudio.volume=1);
  v.addEventListener("ended",()=>bgAudio.volume=1);
});
</script>

</body>
</html>
